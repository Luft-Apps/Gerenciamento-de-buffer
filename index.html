<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gestão de Buffer — LUFT Alpargatas</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        // Sintaxe simples para funcionar mesmo quando os scripts do app forem incompatíveis.
        (function () {
            var failure = '';
            var started = new Date().getTime();
            function recordFailure(event) {
                if (event.target && event.target.tagName === 'SCRIPT') {
                    var source = event.target.getAttribute('src') || '';
                    failure = 'Não foi possível carregar o script: ' + source.split('?')[0];
                } else {
                    failure = 'Ocorreu um erro ao iniciar o sistema. O navegador pode estar incompatível.';
                }
            }
            window.addEventListener('error', recordFailure, true);
            window.addEventListener('unhandledrejection', recordFailure);
            var timer = window.setInterval(function () {
                var app = document.getElementById('app');
                var panel = document.getElementById('startup-status');
                if (!app || !panel) return;
                if (app.querySelector('.login-card, .topbar')) {
                    window.clearInterval(timer);
                    window.removeEventListener('error', recordFailure, true);
                    window.removeEventListener('unhandledrejection', recordFailure);
                    panel.parentNode.removeChild(panel);
                    return;
                }
                if (failure || new Date().getTime() - started >= 15000) {
                    document.getElementById('startup-title').textContent = 'Não foi possível abrir o sistema';
                    document.getElementById('startup-message').textContent = failure || 'O carregamento demorou mais que o esperado. Verifique a conexão e tente novamente.';
                    document.getElementById('startup-help').style.display = 'block';
                    document.getElementById('startup-browser').textContent = navigator.userAgent;
                }
            }, 500);
        }());
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-slate-800 overflow-hidden">
    <div id="startup-status" role="status" aria-live="polite" style="position:fixed;top:0;right:0;bottom:0;left:0;z-index:1000;overflow:auto;padding:24px;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif;">
        <div style="max-width:440px;margin:24px auto;">
            <h1 id="startup-title" style="font-size:22px;">Carregando o sistema…</h1>
            <p id="startup-message">Aguarde enquanto preparamos a tela de acesso.</p>
            <div id="startup-help" style="display:none;">
                <p>Confira a conexão. Se o problema continuar, informe esta mensagem e os dados do navegador ao suporte.</p>
                <button type="button" onclick="window.location.reload()" style="min-height:44px;padding:12px 16px;border:0;border-radius:8px;background:#2563eb;color:white;">Tentar novamente</button>
                <details style="margin-top:20px;">
                    <summary>Dados do navegador</summary>
                    <p id="startup-browser" style="overflow-wrap:break-word;word-wrap:break-word;"></p>
                </details>
            </div>
            <noscript><p>O JavaScript está desativado. Ative-o no navegador para abrir o sistema.</p></noscript>
        </div>
    </div>
    <div id="app" class="min-h-screen flex">
        <!-- Navegação superior e conteúdo serão inseridos aqui -->
    </div>

    <!-- Modals Container -->
    <div id="modals"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js" defer></script>
    <script src="supabase.js" defer></script>
    <script src="storage.js?v=60-v2" defer></script>
    <script src="app.js?v=60-v2" defer></script>
</body>
</html>
